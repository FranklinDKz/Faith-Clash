  <text x="96" y="345" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#f4e9d0" opacity=".8">Katanas  |  Jutsus  |  Armas de fogo  |  Poderes  |  Seu proprio personagem</text>
